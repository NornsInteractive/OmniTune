<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add Cloud Source - Glacier</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary": "#88b4cc",
                        "on-tertiary-fixed": "#1a002e",
                        "error-container": "#3d1414",
                        "surface-container-lowest": "#0a0e1a",
                        "on-secondary-fixed": "#0d1f2b",
                        "surface-tint": "#7dd3fc",
                        "outline": "#4a6070",
                        "tertiary-fixed": "#e8d0ff",
                        "tertiary": "#c8a0f0",
                        "on-tertiary": "#1a002e",
                        "background": "#0a0e1a",
                        "surface-container-low": "#111828",
                        "on-background": "#e0e8f0",
                        "on-tertiary-container": "#e8d0ff",
                        "primary-fixed": "#c8eaff",
                        "secondary-fixed": "#c0d8e8",
                        "surface-variant": "#1a2438",
                        "on-error-container": "#ffb3b3",
                        "surface-dim": "#0f1524",
                        "surface-bright": "#1a2438",
                        "secondary-container": "#1a3a4e",
                        "on-primary-fixed-variant": "#004d73",
                        "tertiary-container": "#3d2060",
                        "outline-variant": "#2a3a48",
                        "on-secondary-fixed-variant": "#2a4a5e",
                        "primary-container": "#0e4d6e",
                        "on-primary": "#001f2e",
                        "on-primary-container": "#c8eaff",
                        "inverse-primary": "#0a4c6e",
                        "primary": "#7dd3fc",
                        "on-surface-variant": "#a0b4c4",
                        "secondary-fixed-dim": "#88b4cc",
                        "on-secondary": "#001f2e",
                        "on-tertiary-fixed-variant": "#4d2a73",
                        "on-error": "#1a0000",
                        "surface-container": "#141c2e",
                        "surface": "#0f1524",
                        "on-primary-fixed": "#001f2e",
                        "inverse-on-surface": "#0a0e1a",
                        "surface-container-high": "#1a2438",
                        "tertiary-fixed-dim": "#c8a0f0",
                        "surface-container-highest": "#202c42",
                        "on-secondary-container": "#c0d8e8",
                        "primary-fixed-dim": "#7dd3fc",
                        "error": "#ff6b6b",
                        "inverse-surface": "#e0e8f0",
                        "on-surface": "#e0e8f0"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "display": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
<style>
        body {
            /* Simulated dark abstract background for glassmorphism to pop against */
            background: radial-gradient(circle at 20% 30%, #111828 0%, #0a0e1a 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen relative font-body antialiased overflow-hidden">
<!-- BACKGROUND LAYER (Simulated "Add Music Source" Screen) -->
<div class="absolute inset-0 z-0 select-none pointer-events-none opacity-40">
<!-- Fake TopAppBar -->
<div class="fixed top-0 w-full z-10 flex justify-between items-center px-6 h-16 border-b border-sky-400/10 shadow-[0_0_30px_rgba(125,211,252,0.05)] bg-[#0a0e1a]/60 backdrop-blur-xl">
<span class="material-symbols-outlined text-slate-400">arrow_back</span>
<span class="font-['Inter'] font-semibold tracking-tight text-on-surface text-lg">Add Source</span>
<span class="material-symbols-outlined text-slate-400">search</span>
</div>
<!-- Fake Grid Content -->
<div class="pt-24 px-4 grid grid-cols-2 gap-4">
<div class="bg-surface-container/30 border border-outline-variant/30 rounded-2xl p-6 flex flex-col items-center justify-center gap-3">
<span class="material-symbols-outlined text-4xl text-primary/50">folder</span>
<span class="text-sm font-medium text-on-surface-variant">Local Files</span>
</div>
<div class="bg-surface-container/30 border border-outline-variant/30 rounded-2xl p-6 flex flex-col items-center justify-center gap-3">
<span class="material-symbols-outlined text-4xl text-primary/50">cloud_queue</span>
<span class="text-sm font-medium text-on-surface-variant">Google Drive</span>
</div>
<div class="bg-surface-container/30 border border-outline-variant/30 rounded-2xl p-6 flex flex-col items-center justify-center gap-3">
<span class="material-symbols-outlined text-4xl text-primary/50">cloud</span>
<span class="text-sm font-medium text-on-surface-variant">Dropbox</span>
</div>
<div class="bg-surface-container/30 border border-outline-variant/30 rounded-2xl p-6 flex flex-col items-center justify-center gap-3">
<span class="material-symbols-outlined text-4xl text-primary/50">dns</span>
<span class="text-sm font-medium text-on-surface-variant">WebDAV</span>
</div>
</div>
</div>
<!-- MODAL OVERLAY -->
<div class="fixed inset-0 z-50 flex items-center justify-center px-4 bg-background/70 backdrop-blur-xl">
<!-- GLACIER MODAL CARD -->
<div class="w-full max-w-[360px] bg-surface/70 backdrop-blur-2xl border border-primary/15 rounded-3xl p-6 shadow-[0_0_50px_rgba(125,211,252,0.08)] flex flex-col relative overflow-hidden">
<!-- Subtle internal glow top edge -->
<div class="absolute top-0 left-1/4 right-1/4 h-[1px] bg-gradient-to-r from-transparent via-primary/30 to-transparent"></div>
<!-- HEADER -->
<div class="flex items-center gap-4 mb-8">
<div class="w-12 h-12 rounded-full bg-primary/10 flex items-center justify-center text-primary border border-primary/20 shadow-[0_0_20px_rgba(125,211,252,0.15)]">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">cloud_queue</span>
</div>
<div>
<h2 class="text-lg font-headline font-semibold text-on-surface tracking-tight">Connect to Google Drive</h2>
<p class="text-xs text-on-surface-variant mt-0.5">Authorize access to your cloud audio.</p>
</div>
</div>
<!-- FORM -->
<form class="flex flex-col gap-5">
<!-- Input Group 1 -->
<div>
<label class="text-[13px] font-medium text-on-surface-variant mb-2 block px-1">Account Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-lg">mail</span>
<input class="w-full bg-surface-container/40 border border-primary/10 rounded-xl pl-10 pr-4 py-3.5 text-sm text-on-surface placeholder:text-on-surface-variant/40 focus:outline-none focus:border-primary/40 focus:ring-1 focus:ring-primary/40 focus:bg-surface-container/60 transition-all shadow-inner" placeholder="you@example.com" type="email"/>
</div>
</div>
<!-- Input Group 2 -->
<div>
<label class="text-[13px] font-medium text-on-surface-variant mb-2 block px-1">Display Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-lg">label</span>
<input class="w-full bg-surface-container/40 border border-primary/10 rounded-xl pl-10 pr-4 py-3.5 text-sm text-on-surface placeholder:text-on-surface-variant/40 focus:outline-none focus:border-primary/40 focus:ring-1 focus:ring-primary/40 focus:bg-surface-container/60 transition-all shadow-inner" placeholder="My Cloud Music" type="text"/>
</div>
</div>
</form>
<!-- ACTIONS -->
<div class="flex items-center justify-end gap-3 mt-8 pt-2">
<button class="px-5 py-2.5 rounded-xl text-sm font-medium text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high/50 transition-colors" type="button">
                    Cancel
                </button>
<button class="px-6 py-2.5 rounded-xl text-sm font-semibold bg-primary/15 text-primary border border-primary/30 hover:bg-primary/25 hover:shadow-[0_0_20px_rgba(125,211,252,0.2)] transition-all active:scale-95 duration-200" type="button">
                    Connect
                </button>
</div>
</div>
</div>
</body></html>
