<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add Music Source</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error-container": "#ffb3b3",
                        "outline": "#4a6070",
                        "on-tertiary-container": "#e8d0ff",
                        "tertiary-fixed-dim": "#c8a0f0",
                        "primary-fixed": "#c8eaff",
                        "on-tertiary-fixed": "#1a002e",
                        "on-surface-variant": "#a0b4c4",
                        "on-tertiary": "#1a002e",
                        "inverse-on-surface": "#0a0e1a",
                        "surface-container-highest": "#202c42",
                        "on-primary-fixed": "#001f2e",
                        "surface": "#0f1524",
                        "outline-variant": "#2a3a48",
                        "surface-container-lowest": "#0a0e1a",
                        "surface-tint": "#7dd3fc",
                        "error": "#ff6b6b",
                        "background": "#0a0e1a",
                        "on-secondary-fixed": "#0d1f2b",
                        "on-secondary": "#001f2e",
                        "surface-variant": "#1a2438",
                        "on-error": "#1a0000",
                        "surface-dim": "#0f1524",
                        "primary": "#7dd3fc",
                        "surface-container-low": "#111828",
                        "on-surface": "#e0e8f0",
                        "secondary-fixed-dim": "#88b4cc",
                        "primary-container": "#0e4d6e",
                        "on-primary": "#001f2e",
                        "on-primary-fixed-variant": "#004d73",
                        "tertiary-container": "#3d2060",
                        "on-secondary-fixed-variant": "#2a4a5e",
                        "surface-bright": "#1a2438",
                        "primary-fixed-dim": "#7dd3fc",
                        "secondary": "#88b4cc",
                        "on-tertiary-fixed-variant": "#4d2a73",
                        "secondary-container": "#1a3a4e",
                        "on-primary-container": "#c8eaff",
                        "error-container": "#3d1414",
                        "surface-container-high": "#1a2438",
                        "on-secondary-container": "#c0d8e8",
                        "inverse-surface": "#e0e8f0",
                        "inverse-primary": "#0a4c6e",
                        "surface-container": "#141c2e",
                        "tertiary": "#c8a0f0",
                        "secondary-fixed": "#c0d8e8",
                        "tertiary-fixed": "#e8d0ff",
                        "on-background": "#e0e8f0"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "display": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #0a0e1a;
            color: #e0e8f0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 0%, rgba(125, 211, 252, 0.05) 0%, transparent 50%);
        }
        
        .glass-panel {
            background: rgba(15, 21, 36, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(125, 211, 252, 0.1);
        }
        
        .glass-elevated {
            background: rgba(15, 21, 36, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(125, 211, 252, 0.15);
            box-shadow: 0 0 30px rgba(125, 211, 252, 0.05);
        }
        
        .glass-input {
            background: rgba(10, 14, 26, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(125, 211, 252, 0.2);
            transition: all 0.3s ease;
        }
        
        .glass-input:focus {
            outline: none;
            border-color: rgba(125, 211, 252, 0.5);
            box-shadow: 0 0 15px rgba(125, 211, 252, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased font-body selection:bg-primary/30 selection:text-primary">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#0a0e1a]/60 backdrop-blur-xl border-b border-sky-400/10 shadow-[0_0_30px_rgba(125,211,252,0.05)]">
<div class="flex items-center px-4 h-16 w-full max-w-4xl mx-auto">
<button aria-label="Go back" class="flex items-center justify-center p-2 rounded-full text-sky-300 hover:bg-sky-400/10 transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="ml-4 font-inter font-semibold tracking-tight text-xl text-sky-300 flex-1">Settings</h1>
</div>
</header>
<!-- Main Content Canvas -->
<main class="pt-24 pb-20 px-4 md:px-8 max-w-4xl mx-auto min-h-screen flex flex-col">
<div class="mb-8">
<h2 class="text-3xl font-bold text-on-surface tracking-tight mb-2">Add Music Source</h2>
<p class="text-on-surface-variant text-sm">Connect your cloud storage or custom server to import your library.</p>
</div>
<!-- Bento Grid for Cloud Services -->
<div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-10">
<!-- Google Drive -->
<button class="glass-panel rounded-xl p-6 flex flex-col items-center justify-center gap-3 hover:bg-surface-variant/80 transition-colors group">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center border border-primary/10 group-hover:border-primary/30 transition-colors">
<span class="material-symbols-outlined text-primary text-2xl">cloud</span>
</div>
<span class="text-sm font-medium text-on-surface">Google Drive</span>
</button>
<!-- Dropbox -->
<button class="glass-panel rounded-xl p-6 flex flex-col items-center justify-center gap-3 hover:bg-surface-variant/80 transition-colors group">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center border border-primary/10 group-hover:border-primary/30 transition-colors">
<span class="material-symbols-outlined text-primary text-2xl">folder</span>
</div>
<span class="text-sm font-medium text-on-surface">Dropbox</span>
</button>
<!-- iCloud -->
<button class="glass-panel rounded-xl p-6 flex flex-col items-center justify-center gap-3 hover:bg-surface-variant/80 transition-colors group">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center border border-primary/10 group-hover:border-primary/30 transition-colors">
<span class="material-symbols-outlined text-primary text-2xl">cloud_queue</span>
</div>
<span class="text-sm font-medium text-on-surface">iCloud</span>
</button>
<!-- OneDrive -->
<button class="glass-panel rounded-xl p-6 flex flex-col items-center justify-center gap-3 hover:bg-surface-variant/80 transition-colors group">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center border border-primary/10 group-hover:border-primary/30 transition-colors">
<span class="material-symbols-outlined text-primary text-2xl">cloud_sync</span>
</div>
<span class="text-sm font-medium text-on-surface">OneDrive</span>
</button>
<!-- WebDAV/Custom (Active State) -->
<button class="glass-elevated rounded-xl p-6 flex flex-col items-center justify-center gap-3 border-primary/40 relative overflow-hidden group col-span-2 md:col-span-2">
<div class="absolute inset-0 bg-primary/5 pointer-events-none"></div>
<div class="w-12 h-12 rounded-full bg-primary/20 flex items-center justify-center border border-primary/50 shadow-[0_0_15px_rgba(125,211,252,0.2)]">
<span class="material-symbols-outlined text-primary text-2xl">dns</span>
</div>
<span class="text-sm font-semibold text-primary">WebDAV / Custom</span>
</button>
</div>
<!-- Custom Connection Form -->
<div class="glass-panel rounded-xl p-6 md:p-8 flex-1 flex flex-col justify-between">
<div class="space-y-6">
<div class="flex items-center gap-2 mb-2 border-b border-outline-variant/30 pb-4">
<span class="material-symbols-outlined text-tertiary text-xl">settings_ethernet</span>
<h3 class="text-lg font-medium text-on-surface">Custom Server Details</h3>
</div>
<div class="space-y-4">
<div class="flex flex-col gap-1.5">
<label class="text-xs font-medium text-on-surface-variant uppercase tracking-wider pl-1" for="server-address">Server Address</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline text-sm">link</span>
<input class="glass-input w-full rounded-lg py-3 pl-10 pr-4 text-sm text-on-surface placeholder-outline-variant w-full" id="server-address" placeholder="https://dav.example.com" type="text"/>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="flex flex-col gap-1.5">
<label class="text-xs font-medium text-on-surface-variant uppercase tracking-wider pl-1" for="username">Username</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline text-sm">person</span>
<input class="glass-input w-full rounded-lg py-3 pl-10 pr-4 text-sm text-on-surface placeholder-outline-variant w-full" id="username" placeholder="admin" type="text"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="text-xs font-medium text-on-surface-variant uppercase tracking-wider pl-1" for="password">Password</label>
<div class="relative">
<span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline text-sm">lock</span>
<input class="glass-input w-full rounded-lg py-3 pl-10 pr-4 text-sm text-on-surface placeholder-outline-variant w-full" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
</div>
</div>
</div>
<div class="mt-8 pt-6 border-t border-outline-variant/30 flex justify-end">
<button class="bg-primary/20 hover:bg-primary/30 border border-primary/40 text-primary font-medium py-3 px-8 rounded-lg transition-all duration-200 flex items-center gap-2 active:scale-95 shadow-[0_0_15px_rgba(125,211,252,0.1)]">
<span class="material-symbols-outlined text-sm">cable</span>
                    Connect Source
                </button>
</div>
</div>
</main>
</body></html>
